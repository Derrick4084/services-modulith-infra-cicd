name: Deploy CDK Pipeline

on:
  workflow_dispatch:

permissions: 
  id-token: write
  contents: read
    
jobs:
  deploy:
    runs-on: ubuntu-latest
    env: 
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }} 


    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 
        uses: actions/setup-python@v5 
        with: 
          python-version: "3.12"

      - name: Setup Node.js 
        uses: actions/setup-node@v4 
        with: 
          node-version: "22"

      - name: Install dependencies 
        run: | 
          python -m pip install --upgrade pip 
          pip install -r requirements.txt

      - name: Install AWS CDK 
        run: npm install -g aws-cdk

      - name: Configure AWS credentials 
        uses: aws-actions/configure-aws-credentials@v4 
        with: 
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }} 
          aws-region: us-east-1

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity


      - name: Deploy Dev Pipeline 
        if: github.ref == 'refs/heads/dev' 
        run: | 
          cdk deploy DevelopmentPipeline --require-approval never

      - name: Deploy Prod Pipeline 
        if: github.ref == 'refs/heads/main' 
        run: | 
          cdk deploy ProductionPipeline --require-approval never